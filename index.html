<style>
:root { color-scheme: light dark; --bg: #fbfbfa; --fg: #1f2328; --muted: #6e7781; --line: #e4e4e1; --accent: #0969da;
  --code: #eff1f3; --match: #fff3b0; --select: #cfe3ff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181c; --fg: #e6edf3; --muted: #8b949e; --line: #2b2f36; --accent: #4493f8;
    --code: #22262c; --match: #5a4a12; --select: #264f78; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
  font: 14px/1.5 system-ui, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
#name, #folder-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#name.dirty::before { content: "• "; color: var(--accent); }
button { font: inherit; color: inherit; background: none; border: 1px solid var(--line); border-radius: 6px;
  padding: 2px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
.levels { display: flex; gap: 2px; margin-right: 6px; }
.levels button { padding: 2px 7px; color: var(--muted); }
.levels button:hover { color: var(--fg); }
main { flex: 1; display: flex; min-height: 0; }
aside { flex: none; width: 240px; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
aside[hidden] { display: none; }
.side-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; font-weight: 600; }
#tree { flex: 1; overflow: auto; padding-bottom: 24px; }
.row { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; padding: 2px 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row:hover { background: var(--line); }
.row.current { background: var(--line); color: var(--accent); }
#editor { flex: 1; min-width: 0; display: flex; justify-content: center; }
#editor .cm-editor { width: 100%; max-width: 50rem; }
</style>

<main>
